<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamaha 01V96V2 — Alterar Senha</title>
  <style>
    :root {
      --bg-chassis: #0b0d11;
      --bg-surface: #141720;
      --bg-panel: #1a1e29;
      --bg-input: #0f1218;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-dim: #8e98a8;
      --text-faint: #5a6475;
      --amber-on: #ff9800;
      --led-green: #10b981;
      --led-red: #ef4444;
      --primary-blue: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: var(--bg-chassis);
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(2, 132, 199, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 152, 0, 0.04) 0%, transparent 50%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .pwd-container {
      width: 100%;
      max-width: 440px;
      z-index: 10;
    }

    .pwd-card {
      background: linear-gradient(180deg, #1c202b 0%, #13161f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .card-top-bar {
      height: 4px;
      background: linear-gradient(90deg, #ff9800 0%, #0284c7 50%, #10b981 100%);
    }

    .card-header {
      padding: 24px 26px 16px 26px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand-logo {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    .user-badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 600;
    }

    .card-body {
      padding: 22px 26px 24px 26px;
    }

    .alert-info {
      display: none;
      background: rgba(255, 152, 0, 0.12);
      border: 1px solid rgba(255, 152, 0, 0.4);
      color: #fcd34d;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 18px;
      align-items: flex-start;
      gap: 10px;
    }

    .alert-info.visible {
      display: flex;
    }

    .alert-error {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
    }

    .alert-error.visible {
      display: flex;
    }

    .alert-success {
      display: none;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
    }

    .alert-success.visible {
      display: flex;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      color: var(--text-faint);
      font-size: 15px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: 44px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      padding: 0 38px 0 38px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--border-focus);
      background: #121620;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #0369a1 0%, #075985 100%);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .card-footer {
      padding: 14px 26px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      gap: 10px;
    }

    .footer-link {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-link:hover {
      color: #ffffff;
    }

    .footer-link.logout {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="pwd-container">
    <div class="pwd-card">
      <div class="card-top-bar"></div>
      <div class="card-header">
        <div class="brand-logo">Yamaha 01V96V2</div>
        <p class="card-subtitle" id="pageSubtitle">Alterar Minha Senha</p>
        <div class="user-badge" id="userBadge">Carregando...</div>
      </div>

      <div class="card-body">
        <div class="alert-info" id="firstLoginBanner">
          <span>🔐</span>
          <span><strong>Primeiro acesso:</strong> por segurança, você precisa definir uma nova senha antes de acessar o console.</span>
        </div>

        <div class="alert-error" id="alertError">
          <span>⚠️</span>
          <span id="alertErrorText">Erro ao alterar senha.</span>
        </div>

        <div class="alert-success" id="alertSuccess">
          <span>✅</span>
          <span id="alertSuccessText">Senha alterada com sucesso!</span>
        </div>

        <form id="changePwdForm">
          <div class="form-group">
            <label for="currentPassword">Senha Atual</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input type="password" id="currentPassword" class="form-control" placeholder="Digite sua senha atual" autocomplete="current-password" required autofocus>
              <button type="button" class="btn-toggle-pwd" data-target="currentPassword" title="Mostrar/ocultar">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label for="newPassword">Nova Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔑</span>
              <input type="password" id="newPassword" class="form-control" placeholder="Mínimo 4 caracteres" autocomplete="new-password" required minlength="4">
              <button type="button" class="btn-toggle-pwd" data-target="newPassword" title="Mostrar/ocultar">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Nova Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">✅</span>
              <input type="password" id="confirmPassword" class="form-control" placeholder="Repita a nova senha" autocomplete="new-password" required minlength="4">
              <button type="button" class="btn-toggle-pwd" data-target="confirmPassword" title="Mostrar/ocultar">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            <span id="btnSubmitText">Salvar Nova Senha</span>
            <span>➔</span>
          </button>
        </form>
      </div>

      <div class="card-footer">
        <a href="/" class="footer-link" id="backLink" style="display: none;">← Voltar ao Console</a>
        <span id="footerSpacer"></span>
        <a href="/logout" class="footer-link logout" id="logoutLink">Sair da Sessão ↪</a>
      </div>
    </div>
  </div>

  <script>
    const BASE_PATH = window.location.pathname.replace(/\/change-password\/?$/, '');
    const backLink = document.getElementById('backLink');
    const logoutLink = document.getElementById('logoutLink');
    if (BASE_PATH) {
      backLink.href = BASE_PATH + '/';
      logoutLink.href = BASE_PATH + '/logout';
    }

    document.querySelectorAll('.btn-toggle-pwd').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target);
        if (!input) return;
        const nextType = input.type === 'password' ? 'text' : 'password';
        input.type = nextType;
        btn.textContent = nextType === 'password' ? '👁️' : '🙈';
      });
    });

    async function loadMe() {
      try {
        const res = await fetch(`${BASE_PATH}/api/me`);
        if (res.status === 401) {
          window.location.href = `${BASE_PATH}/login?error=session`;
          return;
        }
        const me = await res.json();
        document.getElementById('userBadge').textContent = `${me.name || me.username} (@${me.username})`;
        if (me.must_change_password) {
          document.getElementById('firstLoginBanner').classList.add('visible');
          document.getElementById('pageSubtitle').textContent = 'Definição de Senha Obrigatória';
          backLink.style.display = 'none';
        } else {
          backLink.style.display = 'inline';
        }
      } catch (err) {
        console.warn('Erro ao carregar perfil:', err);
      }
    }

    loadMe();

    const form = document.getElementById('changePwdForm');
    const alertError = document.getElementById('alertError');
    const alertErrorText = document.getElementById('alertErrorText');
    const alertSuccess = document.getElementById('alertSuccess');
    const alertSuccessText = document.getElementById('alertSuccessText');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSubmitText = document.getElementById('btnSubmitText');

    function showError(msg) {
      alertSuccess.classList.remove('visible');
      alertErrorText.textContent = msg;
      alertError.classList.add('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertError.classList.remove('visible');
      alertSuccess.classList.remove('visible');

      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 4) {
        showError('A nova senha deve ter pelo menos 4 caracteres.');
        return;
      }
      if (newPassword !== confirmPassword) {
        showError('A confirmação da nova senha não confere.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmitText.textContent = 'Salvando...';

      try {
        const res = await fetch(`${BASE_PATH}/api/change-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          alertSuccessText.textContent = 'Senha alterada com sucesso! Redirecionando...';
          alertSuccess.classList.add('visible');
          const isMobileClient = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
          let dest = data.redirect || '/';
          if (isMobileClient && dest === '/') {
            dest = '/m';
          }
          setTimeout(() => {
            window.location.href = dest.startsWith('/') ? (BASE_PATH + dest) : dest;
          }, 700);
        } else {
          showError(data.error || 'Não foi possível alterar a senha.');
          btnSubmit.disabled = false;
          btnSubmitText.textContent = 'Salvar Nova Senha';
        }
      } catch (err) {
        showError('Erro de comunicação com o servidor.');
        btnSubmit.disabled = false;
        btnSubmitText.textContent = 'Salvar Nova Senha';
      }
    });
  </script>
</body>
</html>
