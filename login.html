<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yamaha 01V96V2 — Acesso ao Console</title>
  <style>
    :root {
      --bg-chassis: #0b0d11;
      --bg-surface: #141720;
      --bg-panel: #1a1e29;
      --bg-input: #0f1218;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-focus: #38bdf8;
      --text-main: #f1f5f9;
      --text-dim: #8e98a8;
      --text-faint: #5a6475;
      --amber-on: #ff9800;
      --amber-glow: rgba(255, 152, 0, 0.4);
      --amber-bright: #ffc107;
      --led-green: #10b981;
      --led-red: #ef4444;
      --primary-blue: #0284c7;
      --primary-blue-hover: #0369a1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: var(--bg-chassis);
      background-image: 
        radial-gradient(ellipse at 50% 15%, rgba(2, 132, 199, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 50% 90%, rgba(255, 152, 0, 0.04) 0%, transparent 50%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      z-index: 10;
    }

    .login-card {
      background: linear-gradient(180deg, #1c202b 0%, #13161f 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      position: relative;
    }

    .card-top-bar {
      height: 4px;
      background: linear-gradient(90deg, #ff9800 0%, #0284c7 50%, #10b981 100%);
    }

    .card-header {
      padding: 26px 26px 18px 26px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #f8fafc;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .brand-tag {
      font-size: 11px;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      border: 1px solid rgba(251, 191, 36, 0.35);
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 10px;
    }

    .card-body {
      padding: 24px 26px 26px 26px;
    }

    .alert-error {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
    }

    .alert-error.visible {
      display: flex;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: var(--text-dim);
      margin-bottom: 7px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 12px;
      color: var(--text-faint);
      font-size: 15px;
      pointer-events: none;
    }

    .form-control {
      width: 100%;
      height: 44px;
      background: var(--bg-input);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      padding: 0 14px 0 38px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-control:focus {
      border-color: var(--border-focus);
      background: #121620;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      color: var(--text-faint);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }

    .btn-toggle-pwd:hover {
      color: var(--text-main);
    }

    .btn-submit {
      width: 100%;
      height: 44px;
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(180deg, #0369a1 0%, #075985 100%);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.45);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .card-footer {
      padding: 14px 26px;
      background: rgba(0, 0, 0, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      font-size: 12px;
      color: var(--text-faint);
    }

    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .led-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--led-green);
      box-shadow: 0 0 6px var(--led-green);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <div class="card-top-bar"></div>
      
      <div class="card-header">
        <div class="brand-section">
          <div class="brand-logo">Yamaha 01V96V2</div>
          <div class="brand-tag">REMOTE CONTROL</div>
        </div>
        <p class="card-subtitle">Autenticação de Operador</p>
      </div>

      <div class="card-body">
        <div class="alert-error" id="alertError">
          <span>⚠️</span>
          <span id="alertErrorText">Usuário ou senha inválidos.</span>
        </div>

        <form id="loginForm" method="POST" action="/login">
          <div class="form-group">
            <label for="username">Usuário</label>
            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input 
                type="text" 
                id="username" 
                name="username" 
                class="form-control" 
                placeholder="Informe seu usuário" 
                autocomplete="username" 
                required 
                autofocus
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input 
                type="password" 
                id="password" 
                name="password" 
                class="form-control" 
                placeholder="Informe sua senha" 
                autocomplete="current-password" 
                required
              >
              <button type="button" class="btn-toggle-pwd" id="btnTogglePwd" title="Mostrar/ocultar senha">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-submit" id="btnSubmit">
            <span id="btnSubmitText">Entrar no Console</span>
            <span>➔</span>
          </button>
        </form>
      </div>

      <div class="card-footer">
        <div class="status-indicator">
          <span class="led-dot"></span>
          <span>Acesso restrito para operadores autorizados</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Verificar se foi passado erro por URL param (?error=invalid)
    const urlParams = new URLSearchParams(window.location.search);
    const alertError = document.getElementById('alertError');
    const alertErrorText = document.getElementById('alertErrorText');
    const loginForm = document.getElementById('loginForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const btnSubmitText = document.getElementById('btnSubmitText');
    const passwordInput = document.getElementById('password');
    const btnTogglePwd = document.getElementById('btnTogglePwd');

    if (urlParams.get('error')) {
      alertError.classList.add('visible');
      if (urlParams.get('error') === 'session') {
        alertErrorText.textContent = 'Sessão expirada. Faça login novamente.';
      } else {
        alertErrorText.textContent = 'Usuário ou senha incorretos.';
      }
    }

    // Toggle exibir/ocultar senha
    btnTogglePwd.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      btnTogglePwd.textContent = type === 'password' ? '👁️' : '🙈';
    });

    // Submissão assíncrona (AJAX) para melhor experiência de usuário
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;

      if (!username || !password) return;

      btnSubmit.disabled = true;
      btnSubmitText.textContent = 'Verificando...';
      alertError.classList.remove('visible');

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          btnSubmitText.textContent = 'Conectando ao Console...';
          const isMobileClient = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
          let dest = data.redirect || '/';
          if (isMobileClient && dest === '/') {
            dest = '/m';
          }
          window.location.href = dest;
        } else {
          alertErrorText.textContent = data.error || 'Usuário ou senha incorretos.';
          alertError.classList.add('visible');
          btnSubmit.disabled = false;
          btnSubmitText.textContent = 'Entrar no Console';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        // Fallback para form normal se JSON falhar
        loginForm.submit();
      }
    });
  </script>
</body>
</html>
