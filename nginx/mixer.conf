# ==============================================================================
# Configuração Nginx: Bloco Location para inclusão em Sites Existentes
# Aplicação: 01V96 Remote Controller na rota /mixer
#
# Como usar:
# 1. Garanta que o bloco 'map $http_upgrade' abaixo esteja presente dentro do
#    bloco 'http { ... }' em /etc/nginx/nginx.conf (ou antes do bloco server):
#
#    map $http_upgrade $connection_upgrade {
#        default upgrade;
#        ''      close;
#    }
#
# 2. No seu arquivo de virtual host (ex: /etc/nginx/sites-available/meusite.conf),
#    dentro do bloco 'server { ... }', adicione:
#
#    include /caminho/para/nginx/mixer.conf;
# ==============================================================================

# 1. Redirecionamento da URL canônica sem barra (/mixer -> /mixer/)
location = /mixer {
    return 301 $scheme://$http_host/mixer/;
}

# 2. Rota principal com Rewrite e suporte completo a WebSocket
location /mixer/ {
    # Remove o prefixo /mixer/ antes de repassar a requisição ao backend Go
    # Exemplo: /mixer/ -> / | /mixer/ws -> /ws | /mixer/api/me -> /api/me
    rewrite ^/mixer/(.*)$ /$1 break;

    # Endereço onde o binário 01v96-controller está escutando (padrão: 9553)
    proxy_pass http://127.0.0.1:9553;

    # Suporte obrigatório a HTTP/1.1 para WebSockets e conexões persistentes
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Cabeçalhos padrão de proxy reverso
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Reescreve cabeçalhos HTTP 'Location' retornados pelo backend Go
    # Exemplo: Se o Go responder com 'Location: /login', o cliente recebe 'Location: /mixer/login'
    proxy_redirect / /mixer/;

    # Reescreve o path dos cookies de sessão (ex: remote_session) de '/' para '/mixer/'
    proxy_cookie_path / /mixer/;

    # Timeouts longos para evitar encerramento prematuro de conexões WebSocket inativas
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 60s;

    # Desativa buffering de resposta para resposta em tempo real imediata dos faders
    proxy_buffering off;
}
