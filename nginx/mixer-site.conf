# ==============================================================================
# Configuração Nginx: Virtual Host Completo (Standalone)
# Aplicação: 01V96 Remote Controller na rota /mixer
#
# Instalação no Ubuntu 20.04:
#   sudo cp nginx/mixer-site.conf /etc/nginx/sites-available/mixer.conf
#   sudo ln -sf /etc/nginx/sites-available/mixer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ==============================================================================

# Mapeamento do cabeçalho de Upgrade para WebSockets
# (Se já estiver definido no seu /etc/nginx/nginx.conf, comente as 4 linhas abaixo)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Tamanho máximo de upload (para importação de arquivos de cenas JSON)
    client_max_body_size 10M;

    # Logs de acesso e erro
    access_log /var/log/nginx/01v96_mixer_access.log;
    error_log  /var/log/nginx/01v96_mixer_error.log warn;

    # 1. Redirecionamento da URL canônica sem barra (/mixer -> /mixer/)
    location = /mixer {
        return 301 $scheme://$http_host/mixer/;
    }

    # 2. Proxy reverso principal na rota /mixer/ com Rewrite e WebSocket
    location /mixer/ {
        # Reescreve a URI removendo '/mixer/' antes de repassar ao Go
        # Ex: /mixer/ -> / | /mixer/ws -> /ws | /mixer/api/scenes -> /api/scenes
        rewrite ^/mixer/(.*)$ /$1 break;

        # Endereço do backend Go
        proxy_pass http://127.0.0.1:8080;

        # Suporte a WebSocket (RFC 6455) e HTTP/1.1
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cabeçalhos padrão repassados ao backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Reescreve cabeçalhos de redirecionamento (Location: /login -> /mixer/login)
        proxy_redirect / /mixer/;

        # Ajusta o escopo do cookie de sessão HTTP-only para a rota /mixer/
        proxy_cookie_path / /mixer/;

        # Timeouts estendidos (24h) para manter o WebSocket aberto durante todo o evento/culto/show
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Desativa o buffer para comunicação instantânea e sem lag nos faders
        proxy_buffering off;
    }
}
